plugins { id 'com.android.application' }

android {
    namespace 'com.coding67.luacity'
    compileSdk 35

    defaultConfig {
        applicationId 'com.coding67.luacity'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
}

// LuaJ is packaged on Maven Central as luaj-jse, version 3.0.1.
dependencies {
    implementation 'org.luaj:luaj-jse:3.0.1'
}
